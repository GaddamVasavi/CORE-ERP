name: CoreERP CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-and-test:
    name: Backend CI (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coreerp_db_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Backend Code Compilation & Quality Check
        working-directory: ./backend
        run: mvn clean compile -B

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/coreerp_db_test
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_password
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: c2VjdXJlX2VudGVycHJpc2Vfc2Fhc19qd3Rfc2VjcmV0X2tleV8yMDI2X2NvcmVlcnBfcGxhdGZvcm0=
        run: mvn test -B

      - name: Package Backend Artifact
        working-directory: ./backend
        run: mvn package -DskipTests -B

  frontend-build-and-test:
    name: Frontend CI (React / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck and Build Frontend
        working-directory: ./frontend
        run: npm run build

  loc-and-quality-gate:
    name: LOC & Code Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build-and-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Codebase LOC
        run: node scripts/count-loc.js

      - name: Verify Git History Integrity
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Total Commits in branch: $COMMIT_COUNT"
